<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Line — a gravity courier game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060d; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #07060d; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Lantern Line: drag back from your paper lantern to aim, release to fly through the light gates in order and land on the far post"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
